<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Machine Blog</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:0 auto;padding:2rem 1.2rem;line-height:1.7;color:#222}
nav{padding:1rem 0;border-bottom:1px solid #eee;margin-bottom:2rem}
a{color:#0366d6;text-decoration:none}
h1,h2{line-height:1.3}</style></head>
<body><nav><a href="/">Money Machine Blog</a> · <a href="/about.html">Chi siamo</a> · <a href="/contact.html">Contatti</a> · <a href="/privacy.html">Privacy</a></nav>
<h1>Money Machine Blog</h1>
<p>Articoli su <strong>viaggi low cost Italia</strong>. Aggiornamento automatico.</p>
<h2>Articoli recenti</h2>
<div id="posts">Caricamento articoli...</div>
<script>
fetch('/posts.json').then(r=>r.ok?r.json():[]).then(posts=>{
  const d=document.getElementById('posts');
  if(!posts.length){d.textContent='Nessun articolo ancora — esegui: python3 engine.py publish <topic>';return}
  d.innerHTML=posts.map(function(p){
    return '<article style="margin-bottom:2rem"><h3><a href="/posts/' + p.slug + '.html">' + p.title + '</a></h3><p style="color:#666;font-size:.9rem">' + p.date + '</p></article>';
  }).join('');
});
</script></body></html>

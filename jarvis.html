<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS - AI Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0a0e14;color:#00d4ff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#0a0e14,#1a1a2e);padding:15px 20px;border-bottom:1px solid #00d4ff;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#0099cc);display:flex;align-items:center;justify-content:center;font-size:20px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 5px #00d4ff}50%{box-shadow:0 0 20px #00d4ff}}
.title{font-size:18px;font-weight:bold}
.status{font-size:11px;color:#0099cc}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5;animation:slideIn 0.3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.user{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#0a0e14;align-self:flex-end;border-bottom-right-radius:4px}
.jarvis{background:#1a1a2e;color:#00d4ff;border:1px solid #00d4ff33;align-self:flex-start;border-bottom-left-radius:4px}
.typing{display:flex;gap:4px;padding:12px 16px}
.typing span{width:8px;height:8px;border-radius:50%;background:#00d4ff;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
.input-bar{display:flex;gap:8px;padding:12px;background:#1a1a2e;border-top:1px solid #00d4ff33}
.input-bar input{flex:1;background:#0a0e14;border:1px solid #00d4ff33;color:#00d4ff;padding:12px 16px;border-radius:24px;font-size:14px;outline:none}
.input-bar input:focus{border-color:#00d4ff}
.input-bar button{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#0a0e14;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.2s}
.input-bar button:active{transform:scale(0.9)}
.suggestions{display:flex;gap:8px;padding:0 12px 8px;overflow-x:auto;flex-wrap:nowrap}
.suggestion{background:#1a1a2e;border:1px solid #00d4ff33;color:#00d4ff;padding:8px 14px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer;transition:all 0.2s}
.suggestion:hover{background:#00d4ff33;border-color:#00d4ff}
</style>
</head>
<body>
<div class="header">
  <div class="avatar">🤖</div>
  <div>
    <div class="title">J.A.R.V.I.S.</div>
    <div class="status" id="status">Online</div>
  </div>
</div>
<div class="chat" id="chat">
  <div class="msg jarvis">Sempre ai tuoi ordini, padrone. Come posso essere utile?</div>
</div>
<div class="suggestions">
  <div class="suggestion" onclick="send('Quanto costa viaggiare in Italia?')">Quanto costa viaggiare?</div>
  <div class="suggestion" onclick="send('Quali sono le tendenze oggi?')">Tendenze oggi</div>
  <div class="suggestion" onclick="send('Raccontami una notizia')">Una notizia</div>
  <div class="suggestion" onclick="send('Come posso guadagnare online?')">Guadagnare online</div>
</div>
<div class="input-bar">
  <input type="text" id="input" placeholder="Scrivi un messaggio..." autocomplete="off">
  <button onclick="sendMessage()">➤</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const status = document.getElementById('status');
function addMsg(text, who) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + who;
  msg.textContent = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}
function addTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg jarvis';
  msg.id = 'typing';
  msg.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}
function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}
async function send(text) {
  addMsg(text, 'user');
  input.value = '';
  addTyping();
  status.textContent = 'Thinking...';
  try {
    const response = await fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'openai',
        messages: [
          { role: 'system', content: 'Sei JARVIS, un AI assistant efficiente e sarcastico come nel film Iron Man. Rispondi in italiano, in modo intelligente ma diretto. Max 150 parole per risposta.' },
          { role: 'user', content: text }
        ]
      })
    });
    const data = await response.json();
    const reply = data.choices[0].message.content;
    removeTyping();
    addMsg(reply, 'jarvis');
    status.textContent = 'Online';
  } catch(e) {
    removeTyping();
    addMsg('Errore di connessione. Riprovo in un secondo.', 'jarvis');
    status.textContent = 'Offline';
  }
}
function sendMessage() {
  const text = input.value.trim();
  if (text) send(text);
}
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
